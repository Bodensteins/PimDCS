phy_array_readMode: 2
phy_array_writeMode: 0
writeV: 3
readV: 1
computeV: 1
# C2C variation, r = Rtarget * exp(q);  q ~ N(0, theta)   
C2C_en: 
    enable: false
    theta: 0.1
D2D_en: false
# I = k*sinh(a*v)
nonLinearIV_en: false
write_cnt_en: false
latency_area_cal:  #all latency is xx ns 
    phyArrayNum: 16
    dac_shared_ratio: 4
    adc_shared_ratio: 4
    dac_latency: 10
    adc_latency: 20
    phyMMLatency: 50
    phyRdLatency: 50
    phyWrLatency: 500
    parWrPhyNum: 16
    parPhyWrSize: 16
    adder_area: 10  # um^2
    adder_latency: 5
    single_dac_area: 0.16
    single_adc_area: 9.3
    single_SH_area: 0.03
    cell_area: 0.0081

energy_cal:  #all energy is nJ
    enable: true
    readRowPeripheryEnergy: 0
    readColPeripheryEnergy: 0
    readUseProbability: false #use probability to calculate or not
    writeRowPeripheryEnergy: 0
    writeColPeripheryEnergy: 0
    writeParallelism: 8 #now we don't support it
    writeUseProbability: true
    DACEnergy: 0
    ADCEnergy: 0
    computeRowPeripheryEnergy: 0
    computeColPeripheryEnergy: 0
    adderEnergy: 0  #add vertical out
    computeUseProbability: false
    CellPD: #read probability distribution, if not illegal, exit
      - 0.1
      - 0.86
      - 0.03
      - 0.01
    CellPDDefault: 0 #0:equal probabilty 1:100% max value
    inVPD: #read probability distribution, if not illegal, exit
      - 0.23
      - 0.24
      - 0.28
      - 0.25
    inVPDDefault: 0 #0:equal probabilty 1:100% max value
    averageEnergyPerWrite: 3.91
    
ir_drop:
    enable: false
    fast_mode: true
    times: 6
    g_load: 0.5
    g_wire: 0.5

SAF:
    enable: false
    runtime_en: true
    init_pSA0: 0.05
    init_pSA1: 0.05
    pSA0: 0.0005
    pSA1: 0.0005


phyArrRowSize: 64
phyArrColSize: 64

minConduct: 1e-7
maxConduct: 1e-4

inVBits: 1
inBits: 9
outBits: 13
unitBits: 8
cellBits: 2
has_negative_input: true
max_phy_input_value: 16
max_weight_value: 4
trunc_input: true
dynamic_max_input: true
mode: 0
